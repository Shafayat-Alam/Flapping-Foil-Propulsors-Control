# ros_gz_bridge configuration for the soft-propulsors prototype (Harmonic).
# Owned by soft_propulsors_control. Bridges gz topics to the ROS 2 topics the
# control stack uses.
#
#   joint feedback : gz JointStatePublisher -> ROS /joint_states
#   imu            : gz IMU sensor          -> ROS /imu
#   camera         : gz camera sensor       -> ROS /camera/image_raw
#   joint commands : ROS Float64 per joint  -> gz JointPositionController
#   clock          : gz sim clock           -> ROS /clock
#
# World name "ocean" and model name "prototype" must match worlds/ocean.sdf and
# the spawn name in gazebo_launch.py. Joint command topics replace the space in
# the CAD joint names ("Revolute 29") with '_' to be valid topic names; these
# must match the <topic> entries in urdf/robot_gz.xacro.

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/ocean/model/prototype/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/prototype/Revolute_29/cmd_pos"
  gz_topic_name: "/prototype/Revolute_29/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/prototype/Revolute_31/cmd_pos"
  gz_topic_name: "/prototype/Revolute_31/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/prototype/Revolute_33/cmd_pos"
  gz_topic_name: "/prototype/Revolute_33/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/prototype/Revolute_34/cmd_pos"
  gz_topic_name: "/prototype/Revolute_34/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
