    procedure: "Place tissue witness inside enclosure; add dye near seams; submerge 0.75 m for >= mission duration; open and inspect witness. (No vacuum test — no syringe.)"
    pass: "Zero water/dye on the interior witness."
    status: open

  - id: VER-005
