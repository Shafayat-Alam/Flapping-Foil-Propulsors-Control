# =====================================================================
# verification.yaml — V&V activities (IEEE 1012) with procedures tailored
# to the confirmed tool set (Round 5). Software V&V is unlimited (manual or
# automated); hardware V&V uses only confirmed tools or documented substitutes.
#
# Each activity carries a TEST VENUE on the model->reality ladder and an
# AUTOMATION level (Round 10):
#   venue:    mil  = model-in-the-loop (pure logic, pytest, no physics)
#             sil  = software-in-the-loop (real nodes vs the KINEMATIC Gazebo)
#             hil  = hardware-in-the-loop (real servos/sensors, dry bench)
#             water= reality (real vehicle in the real pool)
#   automated: full | partial | none
#   human_loop: true if an operator must act through the console during the test
#   script: intended automated-test target (where automated)
# =====================================================================

# ---------------------------------------------------------------------
# Verification strategy — the test-venue ladder + what the KINEMATIC sim
# can and cannot close. This is why the integration plan gates dry->wet.
# ---------------------------------------------------------------------
verification_strategy:
  principle: "Automate as far left on the ladder as the requirement allows; reserve water for what only reality can close."
  venues:
    - {id: mil,   name: "Model-in-the-loop (pure logic)", automatable: full,
       desc: "Node logic exercised in isolation as pytest — no physics, no hardware. Fast, deterministic, runs in CI."}
    - {id: sil,   name: "Software-in-the-loop (kinematic Gazebo)", automatable: full,
       desc: "The real ROS nodes closed-loop against the kinematic Gazebo. Verifies state sequencing, scan/search geometry, topic plumbing, the safety gates and fail-safe transitions. AprilTags are placed in the sim world, so the perception pipeline (acquisition + range/bearing extraction) also runs in SIL."}
    - {id: hil,   name: "Hardware-in-the-loop (dry bench)", automatable: partial,
       desc: "Real servos/IMU/camera on the bench, out of water — bus enumeration, current limits, sensor streams, real detection range/lighting."}
    - {id: water, name: "Reality (in-water)", automatable: none,
       desc: "The real vehicle in the real pool — the only venue for thrust, buoyancy, watertightness, endurance, and hydrodynamic stability. Human-attended."}
  human_in_the_loop:
    desc: "Operator acts through the console (tasking, priority override, escalation acknowledgement); these cannot run fully unattended."
    activities: [VER-005, VER-010, VER-011]
  kinematic_sim:
    is: "Gazebo model is KINEMATIC ONLY — joints move as commanded; there is no hydrodynamics, buoyancy, thrust, or contact drag."
    can_verify: "State-machine sequencing, scan/search geometry, config-before-actuation, startup settle, command clamp, stale-detection reject, malformed-message reject, queue/preemption, fault->HOVERING, return-home logic, ACHIEVED declaration, and the perception pipeline — AprilTags are placed in the sim world, so SCANNING acquisition and range/bearing extraction run in SIL (VER-009)."
    cannot_verify: "Closure rate / thrust (MOP-01), buoyancy (SYS-012), watertightness (SYS-004), endurance (SYS-013), REAL detection range/lighting (SYS-007), hydrodynamic control stability, servo current/thermal, RS-485 bus reality."
    gap: "Perception-SIL is enabled by the AprilTags placed in the ocean.sdf world. What still cannot be closed in sim: real detection range/lighting (SYS-007 stays HIL), and thrust/buoyancy/leak/endurance (stay water) — these drive the dry->wet integration gates."

activities:
  - id: VER-001
    verifies: SYS-001
    method: Demonstration
    integrity: high
    phase: validation
    venue: water
    automated: none
    human_loop: false
    tool: "onboard logs (software)"
    procedure: "Command a tag; observe SCANNING->LOCKING->HEADING->ACHIEVED in mission_status."
    pass: "Vehicle reaches ACHIEVED autonomously, unpiloted."
    status: open

  - id: VER-002
    verifies: SYS-002
    method: Test
    integrity: high
    phase: validation
    venue: water
    automated: none
    human_loop: false
    tool: "onboard apriltag log + overhead phone camera"
    procedure: "Log apriltag range vs time during HEADING; cross-check track with overhead video + pool scale."
    pass: "Range decreases monotonically; mean closure rate > 0 recorded."
    status: open

  - id: VER-003
    verifies: SYS-003
    method: Test
    integrity: critical
    phase: verification
    venue: water
    automated: none
    human_loop: false
    tool: "tape measure + pool"
    procedure: "Submerge to tape-measured 0.75 m for the run duration."
    pass: "Operates at 0.75 m; no ingress (per VER-004)."
    status: open

  - id: VER-004
